name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  worker-check:
    name: Worker build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test --if-present
      - name: Wrangler config dry-run
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --dry-run

  contracts-test:
    name: Hardhat tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hashFiles is invalid in job-level if; gate via step outputs instead
      - name: Check contracts exist
        id: check
        run: |
          if [ -f contracts/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "contracts/ not scaffolded yet — skipping (Dev B lands this)"
          fi

      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: steps.check.outputs.exists == 'true'
        working-directory: contracts
        run: npm ci

      - if: steps.check.outputs.exists == 'true'
        working-directory: contracts
        run: npx hardhat test
